name: 更新美元匯率

on:
  schedule:
    # 臺灣時間每天 09:40、16:10（臺灣銀行早上掛牌與收盤後）
    - cron: '40 1 * * *'
    - cron: '10 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_fx.py
      - name: 有變動才提交
        run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add fx.json
          git diff --cached --quiet || git commit -m "更新匯率 $(date -u +%F)"
          git push
